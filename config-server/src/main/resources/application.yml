dotenv:
  enabled: true

server:
  port: 8888
spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: native
  application:
    name: config-server
  cloud:
    config:
      server:
        overrides: {}
        native:
          search-locations: classpath:/configurations

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
